<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mô hình 3D cuộc thi: UTT SPACES UP 2026</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        
        /* --- GIỮ NGUYÊN ẢNH NỀN SẮC NÉT --- */
        background-image: url("./background.jpg"); 
        background-size: cover;                    
        background-position: center;              
        background-repeat: no-repeat;              
        background-attachment: fixed;              
        
        font-family: sans-serif;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Khung chứa trình xem và nút bấm */
      .viewer-container {
        position: relative;
        width: 100%;
        height: 100%;
      }

      model-viewer {
        width: 100%;
        height: 100%;
        --poster-color: transparent;
      }

      /* Định dạng chung cho nút mũi tên */
      .nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.85);
        border: none;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        font-size: 24px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.2s ease;
        z-index: 10;
        user-select: none;
      }

      .nav-btn:hover {
        background: #ffffff;
        transform: translateY(-50%) scale(1.1);
      }

      .nav-btn:active {
        transform: translateY(-50%) scale(0.95);
      }

      /* Vị trí nút trái / phải */
      #btn-prev { left: 20px; }
      #btn-next { right: 20px; }

      /* Nhãn hiển thị tên mô hình hiện tại */
      .model-info {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 8px 20px;
        border-radius: 20px;
        font-size: 16px;
        font-weight: bold;
        pointer-events: none;
        z-index: 10;
        text-align: center;
        white-space: nowrap;
      }

      /* Định dạng dòng chữ tên cuộc thi phía dưới */
      .contest-title {
        position: absolute;
        bottom: 55px; 
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.6);
        color: #ffd700; 
        padding: 6px 24px;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        text-transform: uppercase; 
        letter-spacing: 1px;       
        pointer-events: none;
        z-index: 10;
        text-align: center;
        white-space: nowrap;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      }

      /* Thanh hướng dẫn vuốt zoom phía dưới */
      .instruction {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.8);
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 12px;
        color: #444;
        pointer-events: none;
        z-index: 10;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>

    <div class="viewer-container">
      <div class="model-info" id="model-title">Mô hình 1 / 5</div>

      <button class="nav-btn" id="btn-prev">❮</button>
      <button class="nav-btn" id="btn-next">❯</button>

      <model-viewer 
        id="viewer"
        src="./tudinhuong.glb" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1.5" 
        environment-image="neutral"
        alt="Trình xem mô hình 3D">
      </model-viewer>

      <div class="contest-title">Chung kết cuộc thi UTT SPACES UP 2026</div>

      <div class="instruction">Xoay tự do bằng tay • Cuộn/Vặn để Zoom</div>
    </div>

    <script>
      // 1. Khai báo danh sách 5 file mô hình glb và tên hiển thị tương ứng
      const models = [
        { src: "./tudinhuong.glb", title: "Nhóm Tử Đinh Hương" },
        { src: "./uptotop.glb", title: "Nhóm Up to Top" },
        { src: "./ecobuilder.glb", title: "Nhóm ECO BUILDERS" },
        { src: "./xemvakhen7m.glb", title: "Nhóm cùng Xem và Khen" },
        { src: "./thu.glb", title: "Nhóm 5" } // Sửa lại tên file .glb và tiêu đề nhóm 5 tại đây
      ];

      let currentIndex = 0; // Để mặc định hiển thị Nhóm số 1 đầu tiên khi mở trang web

      // 2. Lấy các phần tử HTML ra để xử lý
      const viewer = document.getElementById("viewer");
      const modelTitle = document.getElementById("model-title");
      const btnPrev = document.getElementById("btn-prev");
      const btnNext = document.getElementById("btn-next");

      // 3. Hàm cập nhật mô hình mới vào khung hình
      function updateModel(index) {
        viewer.setAttribute("src", models[index].src);
        modelTitle.innerText = `${models[index].title} (${index + 1} / ${models.length})`;
      }

      // 4. Sự kiện khi bấm nút "Sau" (Next)
      btnNext.addEventListener("click", () => {
        currentIndex++;
        if (currentIndex >= models.length) {
          currentIndex = 0; 
        }
        updateModel(currentIndex);
      });

      // 5. Sự kiện khi bấm nút "Trước" (Previous)
      btnPrev.addEventListener("click", () => {
        currentIndex--;
        if (currentIndex < 0) {
          currentIndex = models.length - 1; 
        }
        updateModel(currentIndex);
      });

      // Khởi tạo hiển thị cho lần đầu tiên tải trang
      updateModel(currentIndex);
    </script>

  </body>
</html>
